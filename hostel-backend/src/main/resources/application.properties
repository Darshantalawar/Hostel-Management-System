spring.datasource.url=jdbc:mysql://localhost:3306/hostel_management
spring.datasource.username="YOUR_USERNAME"
spring.datasource.password="YOUR_PASSWORD"

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8083

# JWT settings used by JwtUtil to sign/validate admin & student tokens
jwt.secret=change-this-to-a-long-random-secret-value-before-deploying-to-production-please
jwt.expiration-ms=86400000

# Default admin account created on startup by DataSeeder if no admin exists yet.
# Change these (or the admin row in the DB) after first login.
app.admin.default-username=admin
app.admin.default-email=admin@hostel.com
app.admin.default-password=Admin@123
